name: macOS Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install BWS CLI
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/bitwarden/sdk-sm/releases/download/bws-v2.1.0/bws-macos-universal-2.1.0.zip \
            --output bws.zip
          unzip -q bws.zip
          install -m 0755 bws /usr/local/bin/bws
          rm -f bws.zip bws

      - name: Build app and DMG
        env:
          BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          export SPARKLE_PUBLIC_ED_KEY="$(bws secret get 097e3232-600f-417c-bf10-b4a400a3f8a2 -o json | jq -r '.value')"
          test -n "$SPARKLE_PUBLIC_ED_KEY"
          ./macos/package-release.sh

      - name: Generate Sparkle appcast
        env:
          BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
          RELEASE_URL: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/
        run: |
          SPARKLE_BIN="macos/BinderClipMac/.build/artifacts/sparkle/Sparkle/bin"
          if [ ! -x "$SPARKLE_BIN/generate_appcast" ]; then
            SPARKLE_BIN="macos/BinderClipMac/.build/release-package/arm64/artifacts/sparkle/Sparkle/bin"
          fi
          test -x "$SPARKLE_BIN/generate_appcast"
          mkdir -p appcast-input
          cp dist/BinderClip-*.zip appcast-input/
          bws secret get 8cf93282-1053-4d39-9a99-b4a400a3f9f6 -o json |
            jq -r '.value' |
            "$SPARKLE_BIN/generate_appcast" \
              --ed-key-file - \
              --download-url-prefix "$RELEASE_URL" \
              appcast-input
          cp appcast-input/appcast.xml dist/appcast.xml

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" dist/BinderClip-*.dmg dist/BinderClip-*.zip dist/appcast.xml --clobber
