name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install BWS CLI
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/bitwarden/sdk-sm/releases/download/bws-v2.1.0/bws-macos-universal-2.1.0.zip \
            --output bws.zip
          unzip -q bws.zip
          install -m 0755 bws /usr/local/bin/bws
          rm -f bws.zip bws

      - name: Load Sparkle signing secrets
        env:
          BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
        run: |
          test -n "$BWS_ACCESS_TOKEN"
          bws secret list 5b428380-80fb-459b-959c-b4a4009c3b7d -o env > bws-sparkle.env
          sed -i.bak '/^BWS_ACCESS_TOKEN=/d' bws-sparkle.env
          while IFS='=' read -r key value; do
            echo "::add-mask::$value"
          done < bws-sparkle.env
          cat bws-sparkle.env >> "$GITHUB_ENV"
          rm -f bws-sparkle.env bws-sparkle.env.bak

      - name: Build macOS app and DMG
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: ./macos/package-release.sh

      - name: Generate Sparkle appcast
        env:
          RELEASE_URL: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/
        run: |
          SPARKLE_BIN="macos/BinderClipMac/.build/release-package/arm64/artifacts/sparkle/Sparkle/bin"
          if [ ! -x "$SPARKLE_BIN/generate_appcast" ]; then
            SPARKLE_BIN="macos/BinderClipMac/.build/artifacts/sparkle/Sparkle/bin"
          fi
          test -x "$SPARKLE_BIN/generate_appcast"
          test -n "$SPARKLE_PRIVATE_ED_KEY"
          mkdir -p appcast-input
          cp dist/BinderClip-*.zip appcast-input/
          KEY_FILE=$(mktemp)
          printf '%s' "$SPARKLE_PRIVATE_ED_KEY" > "$KEY_FILE"
          "$SPARKLE_BIN/generate_appcast" \
            --ed-key-file "$KEY_FILE" \
            --download-url-prefix "$RELEASE_URL" \
            appcast-input
          rm -f "$KEY_FILE"
          cp appcast-input/appcast.xml dist/appcast.xml

      - name: Upload macOS release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-release-assets
          path: |
            dist/BinderClip-*.dmg
            dist/BinderClip-*.zip
            dist/appcast.xml

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install BWS CLI
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/bitwarden/sdk-sm/releases/download/bws-v2.1.0/bws-x86_64-unknown-linux-gnu-2.1.0.zip \
            --output bws.zip
          unzip -q bws.zip
          install -m 0755 bws /usr/local/bin/bws
          rm -f bws.zip bws

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore release keystore
        env:
          BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
        run: |
          bws secret get 0ecc5659-116c-4804-8309-b4a3002bd429 -o json |
            jq -r '.value' |
            base64 --decode > android/clipboard-release.keystore

      - name: Build signed APK
        env:
          BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
          VERSION_CODE: ${{ github.run_number }}
          BINDERCLIP_STORE_FILE: ${{ github.workspace }}/android/clipboard-release.keystore
        run: |
          export BINDERCLIP_STORE_PASSWORD="$(bws secret get 9c59ffda-bbb6-4ba3-8c35-b4a3002bd595 -o json | jq -r '.value')"
          export BINDERCLIP_KEY_ALIAS="$(bws secret get 0a668da3-1c95-452d-b53b-b4a3002d5bae -o json | jq -r '.value')"
          VERSION_NAME="${GITHUB_REF_NAME#v}" \
            ./android/gradlew -p android :app:assembleRelease

      - name: Rename APK
        run: mv android/app/build/outputs/apk/release/app-release.apk "BinderClip-${GITHUB_REF_NAME#v}.apk"

      - name: Upload Android release artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-assets
          path: BinderClip-*.apk

  publish:
    needs: [build-macos, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all release assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.ref_name }}" >/dev/null 2>&1 || \
            gh release create "${{ github.ref_name }}" --title "BinderClip ${{ github.ref_name }}" --generate-notes
          gh release upload "${{ github.ref_name }}" release-assets/* --clobber
